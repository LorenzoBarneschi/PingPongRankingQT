<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ping Pong Ranking QT</title>
    <!-- Usa un font di sistema moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>🏓 Ping Pong QT</h1>
    </header>

    <main>
        <!-- VISTA 1: ARENA -->
        <div id="view-arena" class="view active-view">
            <section class="card">
                <h2>🏆 Classifica Live</h2>
                <div class="table-container">
                    <table id="ranking-table">
                        <thead><tr><th>Pos</th><th>Giocatore</th><th>Punti</th><th>V-S</th></tr></thead>
                        <tbody id="ranking-list"><tr><td colspan="4">Caricamento...</td></tr></tbody>
                    </table>
                </div>
            </section>

            <section class="card">
                <h2>⚔️ Nuova Partita</h2>
                <form id="match-form">
                    <div class="players-inputs">
                        <div><label>Vincitore</label><select id="winner" required><option value="">Seleziona...</option></select></div>
                        <div><label>Sconfitto</label><select id="loser" required><option value="">Seleziona...</option></select></div>
                    </div>
                    <div class="match-details">
                        <div><label>Punti Vinc.</label><input type="number" id="score-winner" min="0" required></div>
                        <div><label>Punti Sconf.</label><input type="number" id="score-loser" min="0" required></div>
                    </div>
                    
                    <!-- NUOVO: Selezione Data -->
                    <div>
                        <label>Data e Ora Partita</label>
                        <input type="datetime-local" id="match-date" required>
                    </div>

                    <div>
                        <label>Formato</label>
                        <select id="format" required>
                            <option value="11">Singola a 11 punti</option>
                            <option value="21">Singola a 21 punti</option>
                            <option value="bo3_11">Al meglio delle 3 (a 11 pt)</option>
                            <option value="bo3_21">Al meglio delle 3 (a 21 pt)</option>
                            <option value="custom">⚙️ Personalizzata</option>
                        </select>
                    </div>

                    <!-- NUOVO: Opzioni Formato Personalizzato (Nascosto di default) -->
                    <div id="custom-format-details" style="display: none; background: var(--bg-color); padding: 10px; border-radius: 8px;">
                        <div style="display: flex; gap: 10px;">
                            <div><label>Set Totali (Es. 5 per Bo5)</label><input type="number" id="custom-sets" min="1" value="1"></div>
                            <div><label>Punti a Set</label><input type="number" id="custom-points" min="1" value="11"></div>
                        </div>
                    </div>

                    <div><label>Note (Opzionale)</label><input type="text" id="match-notes" placeholder="Es. Partita sudatissima..."></div>
                    <button type="submit" id="save-match-btn">Salva Risultato</button>
                </form>
            </section>

            <section class="card">
                <h2>⚙️ Gestione Giocatori</h2>
                <form id="player-form" style="margin-bottom: 15px;">
                    <input type="text" id="new-player-name" placeholder="Nuovo giocatore..." required>
                    <button type="submit" class="btn-secondary">Aggiungi</button>
                </form>
                <div class="delete-section">
                    <select id="delete-player-select"><option value="">Seleziona per eliminare...</option></select>
                    <button id="delete-player-btn" class="btn-danger">Elimina</button>
                </div>
            </section>
        </div>

        <!-- VISTA 2: STORICO -->
        <div id="view-history" class="view">
            <section class="card">
                <h2>📜 Storico Partite</h2>
                <div id="history-list"><p>Caricamento storico...</p></div>
            </section>
        </div>

        <!-- VISTA 3: STATISTICHE -->
        <div id="view-stats" class="view">
            <section class="card">
                <h2>Analisi Giocatore</h2>
                <select id="stats-player-select"><option value="general">📊 Statistiche Generali (Gruppo)</option></select>
            </section>

            <section class="card">
                <h2>🎙️ La Voce del Tavolo</h2>
                <p id="ai-comment">Sto analizzando i dati...</p>
                <div id="extra-stats" class="extra-stats-container"></div>
            </section>

            <section class="card chart-wrapper" id="chart-container-line">
                <h2>📈 Andamento Punti</h2>
                <div class="canvas-container"><canvas id="rankingChart"></canvas></div>
            </section>

            <section class="card chart-wrapper" id="chart-container-pie" style="display:none;">
                <h2>🎯 Win Rate</h2>
                <div class="canvas-container" style="max-height: 250px;"><canvas id="winRateChart"></canvas></div>
            </section>
        </div>
    </main>

    <nav class="bottom-nav">
        <button id="nav-arena" class="nav-btn active">🏓<br><span>Arena</span></button>
        <button id="nav-history" class="nav-btn">📜<br><span>Storico</span></button>
        <button id="nav-stats" class="nav-btn">📊<br><span>Statistiche</span></button>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
