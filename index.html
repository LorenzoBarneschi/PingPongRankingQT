<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ping Pong Ranking QT</title>
    <!-- Qui collegheremo il CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Qui collegheremo il Manifest per la PWA -->
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <header>
        <h1>🏓 Ping Pong QT</h1>
    </header>

    <main>
        <!-- SEZIONE 1: Aggiungi Partita -->
        <section id="add-match-section" class="card">
            <h2>Nuova Partita</h2>
            <form id="match-form">
                <div class="players-inputs">
                    <div>
                        <label>Vincitore</label>
                        <select id="winner" required>
                            <option value="">Seleziona...</option>
                            <!-- I nomi li caricheremo da JS -->
                        </select>
                    </div>
                    <div>
                        <label>Sconfitto</label>
                        <select id="loser" required>
                            <option value="">Seleziona...</option>
                        </select>
                    </div>
                </div>

                <div class="match-details">
                    <div>
                        <label>Punti Vincitore</label>
                        <input type="number" id="score-winner" min="11" required>
                    </div>
                    <div>
                        <label>Punti Sconfitto</label>
                        <input type="number" id="score-loser" min="0" required>
                    </div>
                </div>

                <div>
                    <label>Formato / Luogo</label>
                    <select id="format" required>
                        <option value="11">Partita a 11</option>
                        <option value="21">Partita a 21</option>
                        <option value="bo3">Al meglio delle 3</option>
                    </select>
                </div>

                <div>
                    <label>Note (Opzionale)</label>
                    <input type="text" id="match-notes" placeholder="Es. Partita sudattisima, vento forte...">
                </div>

                <button type="submit">Salva Risultato</button>
            </form>
        </section>

        <!-- SEZIONE 2: Classifica -->
        <section id="ranking-section" class="card">
            <h2>Classifica Live 🏆</h2>
            <ul id="ranking-list">
                <!-- La classifica apparirà qui tramite JS -->
                <li>Caricamento in corso...</li>
            </ul>
        </section>
    </main>

    <!-- Questo dice al browser che il nostro file JS è un modulo e gestirà Firebase -->
    <script type="module" src="app.js"></script>
</body>
</html>
