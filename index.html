<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ping Pong Ranking QT</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <!-- Libreria per i futuri grafici -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <header>
        <h1>🏓 Ping Pong QT</h1>
    </header>

    <main>
        <!-- SEZIONE: Classifica -->
        <section id="ranking-section" class="card">
            <h2>🏆 Classifica Live</h2>
            <div class="table-container">
                <table id="ranking-table">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Giocatore</th>
                            <th>Punti</th>
                            <th>V-S</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-list">
                        <tr><td colspan="4">Caricamento...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- SEZIONE: Nuova Partita -->
        <section id="add-match-section" class="card">
            <h2>⚔️ Nuova Partita</h2>
            <form id="match-form">
                <div class="players-inputs">
                    <div>
                        <label>Vincitore</label>
                        <select id="winner" required>
                            <option value="">Seleziona...</option>
                        </select>
                    </div>
                    <div>
                        <label>Sconfitto</label>
                        <select id="loser" required>
                            <option value="">Seleziona...</option>
                        </select>
                    </div>
                </div>

                <div class="match-details">
                    <div>
                        <label>Punti Vincitore</label>
                        <input type="number" id="score-winner" min="11" required>
                    </div>
                    <div>
                        <label>Punti Sconfitto</label>
                        <input type="number" id="score-loser" min="0" required>
                    </div>
                </div>

                <div>
                    <label>Formato</label>
                    <select id="format" required>
                        <option value="11">A 11 punti</option>
                        <option value="21">A 21 punti</option>
                        <option value="bo3">Al meglio delle 3 (Bo3)</option>
                    </select>
                </div>

                <div>
                    <label>Note (Opzionale)</label>
                    <input type="text" id="match-notes" placeholder="Es. Partita sudatissima...">
                </div>

                <button type="submit" id="save-match-btn">Salva Risultato</button>
            </form>
        </section>

        <!-- SEZIONE: Aggiungi Giocatore -->
        <section id="add-player-section" class="card">
            <h2>👤 Aggiungi Giocatore</h2>
            <form id="player-form">
                <input type="text" id="new-player-name" placeholder="Nome giocatore..." required>
                <button type="submit" class="btn-secondary">Aggiungi</button>
            </form>
        </section>

    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
