<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ping Pong Ranking QT</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>🏓 Ping Pong QT</h1>
    </header>

    <main>
        <!-- VISTA 1: ARENA -->
        <div id="view-arena" class="view active-view">
            <section class="card">
                <h2>🏆 Classifica Live</h2>
                <div class="table-container">
                    <table id="ranking-table">
                        <thead><tr><th>Pos</th><th>Giocatore</th><th>Punti</th><th>V-S</th></tr></thead>
                        <tbody id="ranking-list"><tr><td colspan="4">Caricamento...</td></tr></tbody>
                    </table>
                </div>
            </section>

            <section class="card">
                <h2>⚔️ Nuova Partita</h2>
                <form id="match-form">
                    <div class="players-inputs">
                        <div><label>Vincitore</label><select id="winner" required><option value="">Seleziona...</option></select></div>
                        <div><label>Sconfitto</label><select id="loser" required><option value="">Seleziona...</option></select></div>
                    </div>
                    <div class="match-details">
                        <div><label>Punti Vincitore</label><input type="number" id="score-winner" min="11" required></div>
                        <div><label>Punti Sconfitto</label><input type="number" id="score-loser" min="0" required></div>
                    </div>
                    <div>
                        <label>Formato</label>
                        <select id="format" required>
                            <option value="11">Singola a 11 punti</option>
                            <option value="21">Singola a 21 punti</option>
                            <option value="bo3_11">Al meglio delle 3 (a 11 pt)</option>
                            <option value="bo3_21">Al meglio delle 3 (a 21 pt)</option>
                            <option value="bo5">Al meglio delle 5 (Maratona)</option>
                        </select>
                    </div>
                    <div><label>Note</label><input type="text" id="match-notes" placeholder="Es. Partita sudatissima..."></div>
                    <button type="submit" id="save-match-btn">Salva Risultato</button>
                </form>
            </section>

            <section class="card">
                <h2>⚙️ Gestione Giocatori</h2>
                <form id="player-form" style="margin-bottom: 15px;">
                    <input type="text" id="new-player-name" placeholder="Nuovo giocatore..." required>
                    <button type="submit" class="btn-secondary">Aggiungi</button>
                </form>
                <div class="delete-section">
                    <select id="delete-player-select"><option value="">Seleziona per eliminare...</option></select>
                    <button id="delete-player-btn" class="btn-danger">Elimina</button>
                </div>
            </section>
        </div>

        <!-- VISTA 2: STORICO -->
        <div id="view-history" class="view">
            <section class="card">
                <h2>📜 Storico Partite</h2>
                <div id="history-list">
                    <p>Caricamento storico...</p>
                </div>
            </section>
        </div>

        <!-- VISTA 3: STATISTICHE -->
        <div id="view-stats" class="view">
            <section class="card">
                <h2>Analisi Giocatore</h2>
                <select id="stats-player-select">
                    <option value="general">📊 Statistiche Generali (Gruppo)</option>
                </select>
            </section>

            <section class="card">
                <h2>🎙️ La Voce del Tavolo</h2>
                <p id="ai-comment">Sto analizzando i dati...</p>
                <div id="extra-stats" class="extra-stats-container">
                    <!-- Nemesi e Vittima appariranno qui -->
                </div>
            </section>

            <section class="card" id="chart-container-line">
                <h2>📈 Andamento Punti</h2>
                <canvas id="rankingChart"></canvas>
            </section>

            <section class="card" id="chart-container-pie" style="display:none;">
                <h2>🎯 Win Rate</h2>
                <canvas id="winRateChart"></canvas>
            </section>
        </div>
    </main>

    <nav class="bottom-nav">
        <button id="nav-arena" class="nav-btn active">🏓 Arena</button>
        <button id="nav-history" class="nav-btn">📜 Storico</button>
        <button id="nav-stats" class="nav-btn">📊 Statistiche</button>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
