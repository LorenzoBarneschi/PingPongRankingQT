<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ping Pong Ranking QT</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>🏓 Ping Pong QT</h1>
    </header>

    <main>
        <!-- VISTA 1: ARENA (Classifica e Partite) -->
        <div id="view-arena" class="view active-view">
            <section class="card">
                <h2>🏆 Classifica Live</h2>
                <div class="table-container">
                    <table id="ranking-table">
                        <thead>
                            <tr><th>Pos</th><th>Giocatore</th><th>Punti</th><th>V-S</th></tr>
                        </thead>
                        <tbody id="ranking-list">
                            <tr><td colspan="4">Caricamento...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="card">
                <h2>⚔️ Nuova Partita</h2>
                <form id="match-form">
                    <div class="players-inputs">
                        <div><label>Vincitore</label><select id="winner" required><option value="">Seleziona...</option></select></div>
                        <div><label>Sconfitto</label><select id="loser" required><option value="">Seleziona...</option></select></div>
                    </div>
                    <div class="match-details">
                        <div><label>Punti Vincitore</label><input type="number" id="score-winner" min="11" required></div>
                        <div><label>Punti Sconfitto</label><input type="number" id="score-loser" min="0" required></div>
                    </div>
                    <div>
                        <label>Formato</label>
                        <select id="format" required>
                            <option value="11">A 11 punti</option>
                            <option value="21">A 21 punti</option>
                            <option value="bo3">Al meglio delle 3 (Bo3)</option>
                        </select>
                    </div>
                    <div><label>Note</label><input type="text" id="match-notes" placeholder="Es. Partita sudatissima..."></div>
                    <button type="submit" id="save-match-btn">Salva Risultato</button>
                </form>
            </section>

            <section class="card">
                <h2>👤 Aggiungi Giocatore</h2>
                <form id="player-form">
                    <input type="text" id="new-player-name" placeholder="Nome giocatore..." required>
                    <button type="submit" class="btn-secondary">Aggiungi</button>
                </form>
            </section>
        </div>

        <!-- VISTA 2: STATISTICHE (Grafici e AI) -->
        <div id="view-stats" class="view">
            <section class="card">
                <h2>🤖 Il Commento del Mister</h2>
                <p id="ai-comment">Sto analizzando le partite...</p>
            </section>

            <section class="card">
                <h2>📈 Andamento Ranking</h2>
                <canvas id="rankingChart"></canvas>
            </section>
        </div>
    </main>

    <!-- BARRA DI NAVIGAZIONE IN BASSO -->
    <nav class="bottom-nav">
        <button id="nav-arena" class="nav-btn active">🏓 Arena</button>
        <button id="nav-stats" class="nav-btn">📊 Statistiche</button>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
